<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Letter for Foram</title>

<style>

/* =========================================================
   FONTS
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap');


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255,255,255,0.7),
            transparent 45%
        ),
        #e8e1d2;

    color: #202b3d;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.grain {
    position: absolute;
    inset: 0;

    opacity: 0.18;

    background-image:
        radial-gradient(
            rgba(0,0,0,0.18) 0.6px,
            transparent 0.6px
        );

    background-size: 5px 5px;

    mix-blend-mode: multiply;
}

.background-text {
    position: absolute;

    width: 100%;
    text-align: center;

    top: 8%;

    font-family: "Courier Prime", monospace;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;

    color: #7d7566;

    opacity: 0.7;
}


/* =========================================================
   MAIN STAGE
========================================================= */

.stage {
    position: relative;

    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   ENVELOPE
========================================================= */

.envelope-wrapper {
    position: relative;

    width: min(78vw, 520px);

    aspect-ratio: 1.55 / 1;

    cursor: pointer;

    animation:
        float 4s ease-in-out infinite;
}

@keyframes float {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }

}

.envelope-wrapper.opened {
    animation: none;
}

.envelope {
    position: absolute;
    inset: 0;

    background: #efe8d8;

    border: 1px solid #bdb39f;

    box-shadow:
        0 25px 50px rgba(45,40,30,0.18),
        0 5px 10px rgba(45,40,30,0.08);

    overflow: visible;
}


/* =========================================================
   ENVELOPE FRONT
========================================================= */

.envelope-front {
    position: absolute;
    inset: 0;

    z-index: 4;

    background:
        linear-gradient(
            135deg,
            transparent 49.7%,
            #d9d0bd 50%,
            transparent 50.3%
        ),
        linear-gradient(
            225deg,
            transparent 49.7%,
            #d9d0bd 50%,
            transparent 50.3%
        ),
        #eee7d8;

    border: 1px solid #bdb39f;

    pointer-events: none;
}


/* =========================================================
   ENVELOPE FOLDS
========================================================= */

.fold-left {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 50%;
    height: 70%;

    background: #e5dccb;

    clip-path: polygon(
        0 0,
        100% 100%,
        0 100%
    );

    z-index: 5;
}

.fold-right {
    position: absolute;

    bottom: 0;
    right: 0;

    width: 50%;
    height: 70%;

    background: #e2d9c8;

    clip-path: polygon(
        0 100%,
        100% 0,
        100% 100%
    );

    z-index: 5;
}


/* =========================================================
   LETTER INSIDE ENVELOPE
========================================================= */

.letter {
    position: absolute;

    width: 86%;
    height: 88%;

    left: 7%;
    bottom: 4%;

    z-index: 2;

    background: #f7f2e7;

    border: 1px solid #cfc4ae;

    box-shadow:
        0 8px 20px rgba(30,25,15,0.12);

    padding: 30px;

    transform: translateY(25%);

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1);

    pointer-events: none;
}

.letter-content {
    text-align: center;

    font-family: "Cormorant Garamond", serif;
}

.letter-small {
    font-family: "Courier Prime", monospace;

    font-size: 9px;
    letter-spacing: 0.3em;

    text-transform: uppercase;

    color: #8b816f;

    margin-bottom: 20px;
}

.letter-title {
    font-family: "Caveat", cursive;

    font-size: clamp(30px,7vw,48px);

    color: #263247;

    margin-bottom: 10px;
}

.letter-line {
    width: 50px;
    height: 1px;

    background: #a9762f;

    margin: 15px auto;
}

.letter-text {
    font-style: italic;

    font-size: 17px;

    color: #4d5360;
}


/* =========================================================
   ROAST BUTTON ON LETTER
========================================================= */

.roast-button {
    display: inline-block;

    margin-top: 45px;

    padding: 12px 25px;

    border: 1px solid #263247;

    border-radius: 0;

    background: transparent;

    color: #263247;

    font-family: "Courier Prime", monospace;

    font-size: 11px;

    letter-spacing: 0.16em;

    text-transform: uppercase;

    cursor: pointer;

    appearance: none;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.25s ease;
}

.roast-button:hover {
    background: #263247;

    color: #f7f2e7;

    transform: translateY(-2px);
}


/* =========================================================
   FLAP
========================================================= */

.flap {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 58%;

    z-index: 7;

    background: #eee6d6;

    clip-path: polygon(
        0 0,
        100% 0,
        50% 100%
    );

    transform-origin: top center;

    transform: rotateX(0deg);

    transition:
        transform 1.1s cubic-bezier(.4,0,.2,1);

    backface-visibility: hidden;

    filter:
        drop-shadow(
            0 3px 3px rgba(40,35,25,0.08)
        );
}


/* =========================================================
   WAX SEAL
========================================================= */

.seal {
    position: absolute;

    left: 50%;
    top: 52%;

    transform:
        translate(-50%,-50%);

    width: 72px;
    height: 72px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #c74437,
            #922b24 70%
        );

    border: 2px solid #762019;

    box-shadow:
        0 4px 8px rgba(50,20,15,0.25);

    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #f4d7c8;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 24px;
    font-weight: 600;

    transition:
        transform 0.4s ease,
        opacity 0.4s ease;
}

.seal::before {
    content: "";

    position: absolute;
    inset: 6px;

    border: 1px solid rgba(255,220,210,0.45);

    border-radius: 50%;
}


/* =========================================================
   OPEN ENVELOPE
========================================================= */

.envelope-wrapper.opened .flap {
    transform:
        rotateX(180deg);

    z-index: 1;
}

.envelope-wrapper.opened .letter {
    transform:
        translateY(-48%);

    z-index: 8;

    pointer-events: auto;
}

.envelope-wrapper.opened .seal {
    transform:
        translate(-50%,-50%)
        scale(0.65);

    opacity: 0;

    pointer-events: none;
}


/* =========================================================
   INSTRUCTION
========================================================= */

.instruction {
    position: absolute;

    bottom: 11%;

    width: 100%;

    text-align: center;

    font-family:
        "Courier Prime",
        monospace;

    font-size: 10px;

    letter-spacing: 0.22em;

    text-transform: uppercase;

    color: #756d5f;

    transition:
        opacity 0.5s ease;
}

.envelope-wrapper.opened ~ .instruction {
    opacity: 0;
}


/* =========================================================
   DECORATIVE MARK
========================================================= */

.corner-mark {
    position: absolute;

    bottom: 7%;
    left: 50%;

    transform:
        translateX(-50%);

    font-family:
        "Caveat",
        cursive;

    font-size: 20px;

    color: #a9762f;

    opacity: 0.75;
}


/* =========================================================
   FORAM SCREEN
========================================================= */

.foram-screen {
    position: fixed;

    inset: 0;

    z-index: 100;

    background: #f4efe4;

    opacity: 0;
    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
}

.foram-screen.visible {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* =========================================================
   FIVE PHOTO PANELS
========================================================= */

.foram-container {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    overflow: hidden;
}


/*
    Each panel overlaps slightly so there
    are no white gaps between the slants.
*/

.foram-panel {
    position: relative;

    height: 100%;

    flex: 1;

    overflow: hidden;

    cursor: pointer;

    border: 3px solid #111;

    margin-left: -18px;

    clip-path:
        polygon(
            7% 0,
            100% 0,
            93% 100%,
            0 100%
        );

    transition:
        flex 0.45s ease,
        filter 0.35s ease,
        transform 0.35s ease;
}

.foram-panel:first-child {
    margin-left: -2px;
}

.foram-panel:last-child {
    margin-right: -2px;
}


/* =========================================================
   PHOTOS
========================================================= */

.foram-photo {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 0;

    transition:
        transform 0.6s ease,
        filter 0.5s ease;
}


/* =========================================================
   DARK PHOTO OVERLAY
========================================================= */

.foram-photo-overlay {
    position: absolute;

    inset: 0;

    z-index: 1;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.12),
            rgba(0,0,0,0.40)
        );

    transition:
        background 0.4s ease;
}


/* =========================================================
   PANEL CONTENT
========================================================= */

.foram-panel-content {
    position: absolute;

    inset: 0;

    z-index: 2;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    color: white;

    pointer-events: none;

    text-align: center;
}

.foram-letter {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(90px, 10vw, 170px);

    font-weight: 400;

    line-height: 0.9;

    text-shadow:
        0 3px 10px rgba(0,0,0,0.35);

    margin-bottom: 20px;
}

.foram-word {
    font-family:
        "Courier Prime",
        monospace;

    font-size:
        clamp(14px,1.35vw,22px);

    letter-spacing: 0.12em;

    text-shadow:
        0 2px 7px rgba(0,0,0,0.5);
}


/* =========================================================
   HOVER
========================================================= */

.foram-panel:hover {
    flex: 1.12;

    filter:
        brightness(1.08);
}

.foram-panel:hover .foram-photo {
    transform: scale(1.06);
}

.foram-panel:hover .foram-photo-overlay {
    background:
        rgba(0,0,0,0.18);
}

.foram-panel:hover .foram-letter {
    transform:
        scale(1.08);
}


/* =========================================================
   INDIVIDUAL LETTER SCREEN
========================================================= */

.letter-screen {
    position: fixed;

    inset: 0;

    z-index: 200;

    background: #f7f2e7;

    display: flex;

    align-items: center;
    justify-content: center;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.6s ease,
        visibility 0.6s ease;

    /* IMPORTANT:
       Full poems need to be scrollable */
    overflow-y: auto;
}

.letter-screen.visible {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

.letter-screen-content {
    width: min(760px, 88vw);
    height: 100vh;

    padding: 70px 0 60px;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;
}

.letter-screen-letter {
    flex-shrink: 0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: clamp(80px, 12vw, 150px);
    font-weight: 400;

    color: #263247;

    line-height: 0.9;

    margin-bottom: 15px;
}

.letter-screen-word {
    flex-shrink: 0;

    font-family:
        "Courier Prime",
        monospace;

    font-size: 18px;

    letter-spacing: 0.18em;

    text-transform: uppercase;

    color: #a9762f;

    margin-bottom: 30px;
}


/* =========================================================
   POEM SCROLLER
========================================================= */

.letter-screen-roast {
    width: min(620px, 82vw);

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 10px 35px 30px 10px;

    text-align: left;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: clamp(17px, 2vw, 21px);

    font-style: italic;

    line-height: 1.55;

    color: #4d5360;

    white-space: pre-line;

    /*
       Keeps the scrollbar subtle
    */
    scrollbar-width: thin;

    scrollbar-color:
        #a9762f
        transparent;
}


/* Chrome / Edge / Safari */

.letter-screen-roast::-webkit-scrollbar {
    width: 5px;
}

.letter-screen-roast::-webkit-scrollbar-track {
    background: transparent;
}

.letter-screen-roast::-webkit-scrollbar-thumb {
    background: #a9762f;
    border-radius: 10px;
}

.letter-screen-roast::-webkit-scrollbar-thumb:hover {
    background: #263247;
}


/* =========================================================
   NEXT BUTTON
========================================================= */

.next-letter-button {
    flex-shrink: 0;

    margin-top: 25px;

    padding: 12px 28px;

    border: 1px solid #263247;

    background: transparent;

    color: #263247;

    font-family:
        "Courier Prime",
        monospace;

    font-size: 11px;

    letter-spacing: 0.16em;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.25s ease;
}
/* =========================================================
   BACK BUTTON
========================================================= */

.back-to-foram {
    position: absolute;

    top: 25px;
    left: 30px;

    z-index: 100;

    padding: 10px 18px;

    border: 1px solid #263247;

    background: rgba(247, 242, 231, 0.7);

    color: #263247;

    font-family: "Courier Prime", monospace;

    font-size: 11px;

    letter-spacing: 0.16em;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.25s ease;
}

.back-to-foram:hover {
    background: #263247;

    color: #f7f2e7;

    transform: translateY(-2px);
}

.back-to-foram.m-position {
    left: 50%;

    transform:
        translateX(-50%);
}

.back-to-foram.m-position:hover {
    transform:
        translateX(-50%)
        translateY(-2px);
}


/* =========================================================
   NEXT BUTTON
========================================================= */

.next-letter-button {
    padding: 12px 28px;

    border: 1px solid #263247;

    border-radius: 0;

    background: transparent;

    color: #263247;

    font-family:
        "Courier Prime",
        monospace;

    font-size: 11px;

    letter-spacing: 0.16em;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.25s ease;
}

.next-letter-button:hover {
    background: #263247;

    color: #f7f2e7;

    transform:
        translateY(-2px);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .envelope-wrapper {
        width: 84vw;
    }

    .letter {
        padding: 20px;
    }

    .seal {
        width: 62px;
        height: 62px;
    }

    .foram-panel {
        margin-left: -12px;
    }

    .foram-word {
        font-size: 11px;

        letter-spacing: 0.05em;
    }

    .foram-letter {
        font-size: 70px;
    }

    .letter-screen-content {
        width: 90vw;

        padding:
            80px 0
            60px;
    }

    .letter-screen-letter {
        font-size: 90px;
    }

    .letter-screen-word {
        font-size: 15px;

        margin-bottom: 30px;
    }

    .letter-screen-roast {
        width: 88vw;

        font-size: 18px;

        line-height: 1.45;

        margin-bottom: 40px;
    }

    .back-to-foram {
        top: 15px;
        left: 15px;
    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width: 450px) {

    .letter-screen-letter {
        font-size: 75px;
    }

    .letter-screen-roast {
        font-size: 17px;
    }

    .next-letter-button {
        padding: 11px 20px;
    }

}

</style>

</head>


<body>

   <audio
    id="backgroundMusic"
    src="audio.mp3"
    autoplay
    loop
    preload="auto">
</audio>


<!-- =========================================================
     BACKGROUND
========================================================= -->

<div class="background">

    <div class="grain"></div>

    <div class="background-text">
        A little something, properly delivered
    </div>

</div>


<!-- =========================================================
     FIRST SCREEN — ENVELOPE
========================================================= -->

<main class="stage">

    <div
        class="envelope-wrapper"
        id="envelope"
        onclick="openEnvelope()"
    >

        <div class="envelope">


            <!-- LETTER -->

            <div class="letter">

                <div class="letter-content">

                    <div class="letter-small">
                        Opened at your own risk
                    </div>

                    <div class="letter-title">
                        For Foram
                    </div>

                    <div class="letter-line"></div>

                    <div class="letter-text">
                        Some things deserve a proper introduction.
                    </div>

                    <button
                        class="roast-button"
                        onclick="showForam(event)"
                    >
                        I am ready to be roasted
                    </button>

                </div>

            </div>


            <!-- ENVELOPE -->

            <div class="envelope-front"></div>

            <div class="fold-left"></div>

            <div class="fold-right"></div>


            <!-- FLAP -->

            <div class="flap"></div>


            <!-- SEAL -->

            <div class="seal">
                F
            </div>

        </div>

    </div>


    <div class="instruction">
        Tap the seal to open
    </div>


    <div class="corner-mark">
        ✦
    </div>

</main>


<!-- =========================================================
     SECOND SCREEN — FORAM
========================================================= -->

<section
    class="foram-screen"
    id="foramScreen"
>


    <div class="foram-container">


        <!-- =================================================
             F
        ================================================== -->

        <div
            class="foram-panel"
            onclick="openLetter('F')"
        >

            <img
                class="foram-photo"
                src="F.jpeg"
                alt="Funny"
            >

            <div class="foram-photo-overlay"></div>

            <div class="foram-panel-content">

                <div class="foram-letter">
                    F
                </div>

                <div class="foram-word">
                    Funny
                </div>

            </div>

        </div>


        <!-- =================================================
             O
        ================================================== -->

        <div
            class="foram-panel"
            onclick="openLetter('O')"
        >

            <img
                class="foram-photo"
                src="O.jpeg"
                alt="Open-hearted"
            >

            <div class="foram-photo-overlay"></div>

            <div class="foram-panel-content">

                <div class="foram-letter">
                    O
                </div>

                <div class="foram-word">
                    Open-hearted
                </div>

            </div>

        </div>


        <!-- =================================================
             R
        ================================================== -->

        <div
            class="foram-panel"
            onclick="openLetter('R')"
        >

            <img
                class="foram-photo"
                src="R.jpeg"
                alt="Relentless"
            >

            <div class="foram-photo-overlay"></div>

            <div class="foram-panel-content">

                <div class="foram-letter">
                    R
                </div>

                <div class="foram-word">
                    Relentless
                </div>

            </div>

        </div>


        <!-- =================================================
             A
        ================================================== -->

        <div
            class="foram-panel"
            onclick="openLetter('A')"
        >

            <img
                class="foram-photo"
                src="A.jpeg"
                alt="Adorable"
            >

            <div class="foram-photo-overlay"></div>

            <div class="foram-panel-content">

                <div class="foram-letter">
                    A
                </div>

                <div class="foram-word">
                    Adorable
                </div>

            </div>

        </div>


        <!-- =================================================
             M
        ================================================== -->

        <div
            class="foram-panel"
            onclick="openLetter('M')"
        >

            <img
                class="foram-photo"
                src="M.jpeg"
                alt="Menace"
            >

            <div class="foram-photo-overlay"></div>

            <div class="foram-panel-content">

                <div class="foram-letter">
                    M
                </div>

                <div class="foram-word">
                    Menace
                </div>

            </div>

        </div>


    </div>

</section>


<!-- =========================================================
     INDIVIDUAL LETTER / POEM SCREEN
========================================================= -->

<section
    class="letter-screen"
    id="letterScreen"
>


    <button
        class="back-to-foram"
        id="backToForamButton"
        onclick="backToForam()"
    >
        ← FORAM
    </button>


    <div class="letter-screen-content">


        <div
            class="letter-screen-letter"
            id="letterScreenLetter"
        >
            F
        </div>


        <div
            class="letter-screen-word"
            id="letterScreenWord"
        >
            Funny
        </div>


        <div class="letter-screen-roast">

            <p id="roastText">
                Thinks she's hilarious.
                Unfortunately, she's right.
            </p>

        </div>


        <button
            class="next-letter-button"
            id="nextLetterButton"
            onclick="nextLetter()"
        >
            Next: O
        </button>


    </div>

</section>


<script>


/* =========================================================
   ENVELOPE
========================================================= */

let opened = false;


function openEnvelope() {

    if (opened) {
        return;
    }

    opened = true;

    const envelope =
        document.getElementById("envelope");

    envelope.classList.add("opened");
}


/* =========================================================
   SHOW FORAM PAGE
========================================================= */

function showForam(event) {

    event.stopPropagation();

    const stage =
        document.querySelector(".stage");

    const foramScreen =
        document.getElementById("foramScreen");

        "opacity 0.7s ease";

    stage.style.opacity = "0";

        stage.style.display = "none";

        foramScreen.classList.add("visible");

    }, 700);

}

/* =========================================================
   OPEN LETTER
========================================================= */

let currentLetter = null;


function openLetter(letter) {

    currentLetter = letter;


    const screen =
        document.getElementById(
            "letterScreen"
        );


    const letterElement =
        document.getElementById(
            "letterScreenLetter"
        );


    const wordElement =
        document.getElementById(
            "letterScreenWord"
        );


    const roastElement =
        document.getElementById(
            "roastText"
        );


    const button =
        document.getElementById(
            "nextLetterButton"
        );


    const data =
        letterData[letter];


    if (!data) {
        return;
    }


    letterElement.textContent =
        letter;


    wordElement.textContent =
        data.word;


    roastElement.textContent =
        data.roast;


    if (data.next) {

        button.textContent =
            data.next;

        button.style.display =
            "inline-block";

    } else {

        /*
           M is the final letter.
           Hide the Next button because
           there is nowhere else to go.
        */

        button.style.display =
            "none";

    }


    document
        .getElementById("backToForamButton")
        .classList.toggle(
            "m-position",
            letter === "M"
        );


    screen.classList.add(
        "visible"
    );


    /*
       Always start the poem at the top
       when opening a new letter.
    */

    screen.scrollTop = 0;

}


/* =========================================================
   BACK TO FORAM
========================================================= */

function backToForam() {

    const letterScreen =
        document.getElementById(
            "letterScreen"
        );


    const foramScreen =
        document.getElementById(
            "foramScreen"
        );


    letterScreen.classList.remove(
        "visible"
    );


    currentLetter = null;


    foramScreen.classList.add(
        "visible"
    );

}


/* =========================================================
   NEXT LETTER
========================================================= */

function nextLetter() {

    const order = [
        "F",
        "O",
        "R",
        "A",
        "M"
    ];


    const currentIndex =
        order.indexOf(
            currentLetter
        );


    if (currentIndex === -1) {
        return;
    }


    if (
        currentIndex ===
        order.length - 1
    ) {

        return;

    }


    openLetter(
        order[currentIndex + 1]
    );

}
