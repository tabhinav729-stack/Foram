<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Letter for Foram</title>

<style>

    .roast-button {
    display: inline-block;

    margin-top: 32px;
    padding: 12px 24px;

    border: 1px solid #263247;
    background: transparent;

    color: #263247;

    font-family: "Courier Prime", monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;

    text-decoration: none;

    transition:
        background 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;
}

.roast-button:hover {
    background: #263247;
    color: #f7f2e7;

    transform: translateY(-2px);
}
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        overflow: hidden;

        background:
            radial-gradient(
                circle at 50% 40%,
                rgba(255,255,255,0.7),
                transparent 45%
            ),
            #e8e1d2;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #202b3d;
    }

    /* --------------------------------
       BACKGROUND
    -------------------------------- */

    .background {
        position: fixed;
        inset: 0;
        pointer-events: none;
    }

    .grain {
        position: absolute;
        inset: 0;

        opacity: 0.18;

        background-image:
            radial-gradient(
                rgba(0,0,0,0.18) 0.6px,
                transparent 0.6px
            );

        background-size: 5px 5px;
        mix-blend-mode: multiply;
    }

    .background-text {
        position: absolute;
        width: 100%;
        text-align: center;

        top: 8%;

        font-family: "Courier Prime", monospace;
        font-size: 11px;
        letter-spacing: 0.35em;
        text-transform: uppercase;

        color: #7d7566;

        opacity: 0.7;
    }

    /* --------------------------------
       MAIN STAGE
    -------------------------------- */

    .stage {
        position: relative;

        width: 100%;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        perspective: 1200px;
    }

    /* --------------------------------
       ENVELOPE
    -------------------------------- */

    .envelope-wrapper {
        position: relative;

        width: min(78vw, 520px);

        aspect-ratio: 1.55 / 1;

        cursor: pointer;

        transform-style: preserve-3d;

        animation:
            float 4s ease-in-out infinite;
    }

    @keyframes float {

        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-8px);
        }
    }

    .envelope-wrapper.opened {
        animation: none;
    }

    .envelope {
        position: absolute;
        inset: 0;

        background: #efe8d8;

        border: 1px solid #bdb39f;

        box-shadow:
            0 25px 50px rgba(45, 40, 30, 0.18),
            0 5px 10px rgba(45, 40, 30, 0.08);

        transform-style: preserve-3d;

        overflow: visible;
    }

    /* --------------------------------
       ENVELOPE FRONT
    -------------------------------- */

    .envelope-front {
        position: absolute;
        inset: 0;

        z-index: 4;

        background:
            linear-gradient(
                135deg,
                transparent 49.7%,
                #d9d0bd 50%,
                transparent 50.3%
            ),
            linear-gradient(
                225deg,
                transparent 49.7%,
                #d9d0bd 50%,
                transparent 50.3%
            ),
            #eee7d8;

        border: 1px solid #bdb39f;

        pointer-events: none;
    }

    /* --------------------------------
       ENVELOPE LOWER FOLDS
    -------------------------------- */

    .fold-left {
        position: absolute;

        bottom: 0;
        left: 0;

        width: 50%;
        height: 70%;

        background: #e5dccb;

        clip-path: polygon(
            0 0,
            100% 100%,
            0 100%
        );

        z-index: 5;

        border-left: 1px solid #c9bfae;
    }

    .fold-right {
        position: absolute;

        bottom: 0;
        right: 0;

        width: 50%;
        height: 70%;

        background: #e2d9c8;

        clip-path: polygon(
            0 100%,
            100% 0,
            100% 100%
        );

        z-index: 5;

        border-right: 1px solid #c9bfae;
    }

    /* --------------------------------
       LETTER
    -------------------------------- */

    .letter {
        position: absolute;

        width: 86%;
        height: 88%;

        left: 7%;

        bottom: 4%;

        z-index: 2;

        background: #f7f2e7;

        border: 1px solid #cfc4ae;

        box-shadow:
            0 8px 20px rgba(30,25,15,0.12);

        padding: 30px;

        transform: translateY(25%);

        transition:
            transform 1s cubic-bezier(.2,.8,.2,1);

        pointer-events: none;
    }

    .letter-content {
        text-align: center;

        font-family: "Cormorant Garamond", serif;
    }

    .letter-small {
        font-family: "Courier Prime", monospace;

        font-size: 9px;

        letter-spacing: 0.3em;

        text-transform: uppercase;

        color: #8b816f;

        margin-bottom: 20px;
    }

    .letter-title {
        font-family: "Caveat", cursive;

        font-size: clamp(30px, 7vw, 48px);

        color: #263247;

        margin-bottom: 10px;
    }

    .letter-line {
        width: 50px;
        height: 1px;

        background: #a9762f;

        margin: 15px auto;
    }

    .letter-text {
        font-style: italic;

        font-size: 17px;

        color: #4d5360;
    }

    /* --------------------------------
       FLAP
    -------------------------------- */

    .flap {
        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 58%;

        z-index: 7;

        background: #eee6d6;

        clip-path: polygon(
            0 0,
            100% 0,
            50% 100%
        );

        transform-origin: top center;

        transform: rotateX(0deg);

        transition:
            transform 1.1s cubic-bezier(.4,0,.2,1);

        backface-visibility: hidden;

        filter: drop-shadow(
            0 3px 3px rgba(40,35,25,0.08)
        );
    }

    .flap::after {
        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,0.3),
                transparent 45%
            );
    }

    /* --------------------------------
       WAX SEAL
    -------------------------------- */

    .seal {
        position: absolute;

        left: 50%;
        top: 52%;

        transform:
            translate(-50%, -50%);

        width: 72px;
        height: 72px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle at 35% 30%,
                #c74437,
                #922b24 70%
            );

        border: 2px solid #762019;

        box-shadow:
            0 4px 8px rgba(50,20,15,0.25);

        z-index: 10;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #f4d7c8;

        font-family: "Cormorant Garamond", serif;

        font-size: 24px;
        font-weight: 600;

        transition:
            transform 0.4s ease,
            opacity 0.4s ease;
    }

    .seal::before {
        content: "";

        position: absolute;

        inset: 6px;

        border: 1px solid rgba(255,220,210,0.45);

        border-radius: 50%;
    }

    /* --------------------------------
       OPEN STATE
    -------------------------------- */

    .envelope-wrapper.opened .flap {

        transform:
            rotateX(180deg);

        z-index: 1;
    }

    .envelope-wrapper.opened .letter {

        transform:
            translateY(-48%);

        z-index: 8;
    }

    .envelope-wrapper.opened .seal {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0;
    }

    /* --------------------------------
       INSTRUCTION
    -------------------------------- */

    .instruction {

        position: absolute;

        bottom: 11%;

        width: 100%;

        text-align: center;

        font-family: "Courier Prime", monospace;

        font-size: 10px;

        letter-spacing: 0.22em;

        text-transform: uppercase;

        color: #756d5f;

        transition:
            opacity 0.5s ease;
    }

    .opened + .instruction {
        opacity: 0;
    }

    /* --------------------------------
       LITTLE DECORATIVE MARK
    -------------------------------- */

    .corner-mark {

        position: absolute;

        bottom: 7%;

        left: 50%;

        transform: translateX(-50%);

        font-family: "Caveat", cursive;

        font-size: 20px;

        color: #a9762f;

        opacity: 0.75;
    }

    /* --------------------------------
       MOBILE
    -------------------------------- */

    @media (max-width: 600px) {

        .envelope-wrapper {
            width: 84vw;
        }

        .letter {
            padding: 20px;
        }

        .seal {
            width: 62px;
            height: 62px;
        }

        .instruction {
            bottom: 12%;
        }
    }

</style>
</head>

<body>

<div class="background">
    <div class="grain"></div>

    <div class="background-text">
        A little something, properly delivered
    </div>
</div>


<main class="stage">

    <div
        class="envelope-wrapper"
        id="envelope"
        onclick="openEnvelope()"
    >

        <div class="envelope">

            <!-- Letter hidden inside -->
            <div class="letter">

                <div class="letter-content">

                    <div class="letter-small">
                        Opened at your own risk
                    </div>

                    <div class="letter-title">
                        For Foram
                    </div>

                    <div class="letter-line"></div>

                    <div class="letter-text">
                        Some things deserve a proper introduction.
                    </div>

                    <a href="report-card.html" class="roast-button">
    I am ready to be roasted
</a>

                </div>

            </div>


            <!-- Envelope body -->
            <div class="envelope-front"></div>

            <div class="fold-left"></div>
            <div class="fold-right"></div>


            <!-- Opening flap -->
            <div class="flap"></div>


            <!-- Wax seal -->
            <div class="seal">
                F
            </div>

        </div>

    </div>


    <div class="instruction">
        Tap the seal to open
    </div>

    <div class="corner-mark">
        ✦
    </div>

</main>


<script>

    let opened = false;

    function openEnvelope() {

        if (opened) return;

        opened = true;

        const envelope =
            document.getElementById("envelope");

        envelope.classList.add("opened");

        /*
         * Optional:
         * After the envelope finishes opening,
         * you can redirect to your report card page.
         *
         * Example:
         *
         * setTimeout(() => {
         *     window.location.href = "report-card.html";
         * }, 2500);
         */

    }

</script>

</body>
</html>
