/* =========================================
   FORAM FULL-SCREEN REVEAL
========================================= */

.foram-screen {
    position: fixed;
    inset: 0;

    opacity: 0;

/* =========================================
   FULL-WIDTH FORAM
========================================= */

.foram-svg {
    width: 94vw;
    height: auto;

    max-width: 1500px;

    overflow: visible;
}


/* =========================================
   PANEL LINES
========================================= */

.panel-line {
    fill: none;

    stroke: #080808;
    stroke-width: 3.5;

    stroke-linecap: round;
    stroke-linejoin: round;

    vector-effect: non-scaling-stroke;

    transition:
        stroke 0.3s ease,
        stroke-width 0.3s ease;
}


/* =========================================
   PANEL HOVER AREAS
========================================= */

.foram-panel {
    fill: transparent;

    cursor: pointer;

    transition:
        fill 0.3s ease;
}


/*
   Individual panel highlight
*/

.foram-panel:hover {
    fill: rgba(169, 118, 47, 0.10);
}


/*
   Make the outline slightly stronger
   when the panel is hovered.
*/

.foram-panel:hover + .panel-outline {
    stroke: #a9762f;
    stroke-width: 5;
}


/* =========================================
   LETTERS
========================================= */

.foram-letter {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 82px;
    font-weight: 400;

    fill: #050505;

    text-anchor: middle;

    pointer-events: none;

    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    transform: translateY(12px);

    transition:
        opacity 0.45s ease,
        transform 0.3s ease,
        fill 0.3s ease;
}


/* =========================================

    transform: translateY(0);
}

    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        overflow: hidden;

        background:
            radial-gradient(
                circle at 50% 40%,
                rgba(255,255,255,0.7),
                transparent 45%
            ),
            #e8e1d2;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #202b3d;
    }

    /* --------------------------------
       BACKGROUND
    -------------------------------- */

    .background {
        position: fixed;
        inset: 0;
        pointer-events: none;
    }

    .grain {
        position: absolute;
        inset: 0;

        opacity: 0.18;

        background-image:
            radial-gradient(
                rgba(0,0,0,0.18) 0.6px,
                transparent 0.6px
            );

        background-size: 5px 5px;
        mix-blend-mode: multiply;
    }

    .background-text {
        position: absolute;
        width: 100%;
        text-align: center;

        top: 8%;

        font-family: "Courier Prime", monospace;
        font-size: 11px;
        letter-spacing: 0.35em;
        text-transform: uppercase;

        color: #7d7566;

        opacity: 0.7;
    }

    /* --------------------------------
       MAIN STAGE
    -------------------------------- */

    .stage {
        position: relative;

        width: 100%;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        perspective: 1200px;
    }

    /* --------------------------------
       ENVELOPE
    -------------------------------- */

    .envelope-wrapper {
        position: relative;

        width: min(78vw, 520px);

        aspect-ratio: 1.55 / 1;

        cursor: pointer;

        transform-style: preserve-3d;

        animation:
            float 4s ease-in-out infinite;
    }

    @keyframes float {

        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-8px);
        }
    }

    .envelope-wrapper.opened {
        animation: none;
    }

    .envelope {
        position: absolute;
        inset: 0;

        background: #efe8d8;

        border: 1px solid #bdb39f;

        box-shadow:
            0 25px 50px rgba(45, 40, 30, 0.18),
            0 5px 10px rgba(45, 40, 30, 0.08);

        transform-style: preserve-3d;

        overflow: visible;
    }

    /* --------------------------------
       ENVELOPE FRONT
    -------------------------------- */

    .envelope-front {
        position: absolute;
        inset: 0;

        z-index: 4;

        background:
            linear-gradient(
                135deg,
                transparent 49.7%,
                #d9d0bd 50%,
                transparent 50.3%
            ),
            linear-gradient(
                225deg,
                transparent 49.7%,
                #d9d0bd 50%,
                transparent 50.3%
            ),
            #eee7d8;

        border: 1px solid #bdb39f;

        pointer-events: none;
    }

    /* --------------------------------
       ENVELOPE LOWER FOLDS
    -------------------------------- */

    .fold-left {
        position: absolute;

        bottom: 0;
        left: 0;

        width: 50%;
        height: 70%;

        background: #e5dccb;

        clip-path: polygon(
            0 0,
            100% 100%,
            0 100%
        );

        z-index: 5;

        border-left: 1px solid #c9bfae;
    }

    .fold-right {
        position: absolute;

        bottom: 0;
        right: 0;

        width: 50%;
        height: 70%;

        background: #e2d9c8;

        clip-path: polygon(
            0 100%,
            100% 0,
            100% 100%
        );

        z-index: 5;

        border-right: 1px solid #c9bfae;
    }

    /* --------------------------------
       LETTER
    -------------------------------- */

    .letter {
        position: absolute;

        width: 86%;
        height: 88%;

        left: 7%;

        bottom: 4%;

        z-index: 2;

        background: #f7f2e7;

        border: 1px solid #cfc4ae;

        box-shadow:
            0 8px 20px rgba(30,25,15,0.12);

        padding: 30px;

        transform: translateY(25%);

        transition:
            transform 1s cubic-bezier(.2,.8,.2,1);

        pointer-events: auto;
    }

    .letter-content {
        text-align: center;

        font-family: "Cormorant Garamond", serif;
    }

    .letter-small {
        font-family: "Courier Prime", monospace;

        font-size: 9px;

        letter-spacing: 0.3em;

        text-transform: uppercase;

        color: #8b816f;

        margin-bottom: 20px;
    }

    .letter-title {
        font-family: "Caveat", cursive;

        font-size: clamp(30px, 7vw, 48px);

        color: #263247;

        margin-bottom: 10px;
    }

    .letter-line {
        width: 50px;
        height: 1px;

        background: #a9762f;

        margin: 15px auto;
    }

    .letter-text {
        font-style: italic;

        font-size: 17px;

        color: #4d5360;
    }

    /* --------------------------------
       FLAP
    -------------------------------- */

    .flap {
        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 58%;

        z-index: 7;

        background: #eee6d6;

        clip-path: polygon(
            0 0,
            100% 0,
            50% 100%
        );

        transform-origin: top center;

        transform: rotateX(0deg);

        transition:
            transform 1.1s cubic-bezier(.4,0,.2,1);

        backface-visibility: hidden;

        filter: drop-shadow(
            0 3px 3px rgba(40,35,25,0.08)
        );
    }

    .flap::after {
        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,0.3),
                transparent 45%
            );
    }

    /* --------------------------------
       WAX SEAL
    -------------------------------- */

    .seal {
        position: absolute;

        left: 50%;
        top: 52%;

        transform:
            translate(-50%, -50%);

        width: 72px;
        height: 72px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle at 35% 30%,
                #c74437,
                #922b24 70%
            );

        border: 2px solid #762019;

        box-shadow:
            0 4px 8px rgba(50,20,15,0.25);

        z-index: 10;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #f4d7c8;

        font-family: "Cormorant Garamond", serif;

        font-size: 24px;
        font-weight: 600;

        transition:
            transform 0.4s ease,
            opacity 0.4s ease;
    }

    .seal::before {
        content: "";

        position: absolute;

        inset: 6px;

        border: 1px solid rgba(255,220,210,0.45);

        border-radius: 50%;
    }

    /* --------------------------------
       OPEN STATE
    -------------------------------- */

    .envelope-wrapper.opened .flap {

        transform:
            rotateX(180deg);

        z-index: 1;
    }

    .envelope-wrapper.opened .letter {

        transform:
            translateY(-48%);

        z-index: 8;
    }

    .envelope-wrapper.opened .seal {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0;
    }

    /* --------------------------------
       INSTRUCTION
    -------------------------------- */

    .instruction {

        position: absolute;

        bottom: 11%;

        width: 100%;

        text-align: center;

        font-family: "Courier Prime", monospace;

        font-size: 10px;

        letter-spacing: 0.22em;

        text-transform: uppercase;

        color: #756d5f;

        transition:
            opacity 0.5s ease;
    }

    .opened + .instruction {
        opacity: 0;
    }

    /* --------------------------------
       LITTLE DECORATIVE MARK
    -------------------------------- */

    .corner-mark {

        position: absolute;

        bottom: 7%;

        left: 50%;

        transform: translateX(-50%);

        font-family: "Caveat", cursive;

        font-size: 20px;

        color: #a9762f;

        opacity: 0.75;
    }

    /* --------------------------------
       MOBILE
    -------------------------------- */

    @media (max-width: 600px) {

        .envelope-wrapper {
            width: 84vw;
        }

        .letter {
            padding: 20px;
        }

        .seal {
            width: 62px;
            height: 62px;
        }

        .instruction {
            bottom: 12%;
        }
    }

</style>
</head>

<body>

<div class="background">
    <div class="grain"></div>

    <div class="background-text">
        A little something, properly delivered
    </div>
</div>


<main class="stage">

    <div
        class="envelope-wrapper"
        id="envelope"
        onclick="openEnvelope()"
    >

        <div class="envelope">

            <!-- Letter hidden inside -->
            <div class="letter">

                <div class="letter-content">

                    <div class="letter-small">
                        Opened at your own risk
                    </div>

                    <div class="letter-title">
                        For Foram
                    </div>

                    <div class="letter-line"></div>

                    <div class="letter-text">
                        Some things deserve a proper introduction.
                    </div>

                    <div class="button-divider"></div>
                    
                     <button class="roast-button" onclick="showForam(event)">
                        I am ready to be roasted
                     </button>
    
                </div>

            </div>

            <!-- Envelope body -->
            <div class="envelope-front"></div>

            <div class="fold-left"></div>
            <div class="fold-right"></div>


            <!-- Opening flap -->
            <div class="flap"></div>


            <!-- Wax seal -->
            <div class="seal">
                F
            </div>

        </div>

    </div>


    <div class="instruction">
        Tap the seal to open
    </div>

    <div class="corner-mark">
        ✦
    </div>

</main>

    <!-- =========================================

========================================= -->

<section class="foram-screen" id="foramScreen">

    <svg class="foram-svg" viewBox="0 0 1500 500" preserveAspectRatio="xMidYMid meet" aria-label="FORAM" > <!-- ================================= PANEL 1 — F ================================== --> <g class="panel-group"> <polygon class="foram-panel" points="80,70 350,70 290,430 20,430" /> <path class="panel-line panel-outline" d="M 80 70 L 350 70 L 290 430 L 20 430 Z" /> <text class="foram-letter letter-1" x="185" y="315" >F</text> </g> <!-- ================================= PANEL 2 — O ================================== --> <g class="panel-group"> <polygon class="foram-panel" points="350,70 650,70 590,430 290,430" /> <path class="panel-line panel-outline" d="M 350 70 L 650 70 L 590 430 L 290 430" /> <text class="foram-letter letter-2" x="470" y="315" >O</text> </g> <!-- ================================= PANEL 3 — R ================================== --> <g class="panel-group"> <polygon class="foram-panel" points="650,70 900,70 850,430 590,430" /> <path class="panel-line panel-outline" d="M 650 70 L 900 70 L 850 430 L 590 430" /> <text class="foram-letter letter-3" x="720" y="315" >R</text> </g> <!-- ================================= PANEL 4 — A ================================== --> <g class="panel-group"> <polygon class="foram-panel" points="900,70 1180,70 1130,430 850,430" /> <path class="panel-line panel-outline" d="M 900 70 L 1180 70 L 1130 430 L 850 430" /> <text class="foram-letter letter-4" x="1015" y="315" >A</text> </g> <!-- ================================= PANEL 5 — M ================================== --> <g class="panel-group"> <polygon class="foram-panel" points="1180,70 1470,70 1400,430 1130,430" /> <path class="panel-line panel-outline" d="M 1180 70 L 1470 70 L 1400 430 L 1130 430" /> <text class="foram-letter letter-5" x="1290" y="315" >M</text> </g> </svg> </section>
    
<script>

    function showForam(event) {

    event.stopPropagation();

    const stage = document.querySelector(".stage");
    const foramScreen = document.getElementById("foramScreen");

    stage.style.transition = "opacity 0.7s ease";    envelope.style.opacity = "0";

    // Hide the envelope completely
    setTimeout(() => {

        envelope.style.display = "none";

        // Show FORAM screen
        foramScreen.classList.add("visible");

    }, 700);
}

    let opened = false;

    function openEnvelope() {

        if (opened) return;

        opened = true;

        const envelope =
            document.getElementById("envelope");

        envelope.classList.add("opened");

        /*
         * Optional:
         * After the envelope finishes opening,
         * you can redirect to your report card page.
         *
         * Example:
         *
         * setTimeout(() => {
         *     window.location.href = "report-card.html";
         * }, 2500);
         */

    }

</script>
