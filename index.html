<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Foram</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap');


/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255,255,255,0.75),
            transparent 45%
        ),
        #e8e1d2;

    color: #263247;
}


/* =====================================================
   OPENING SCREEN
===================================================== */

.stage {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255,255,255,0.7),
            transparent 45%
        ),
        #e8e1d2;

    z-index: 10;

    transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
}


/* small top text */

.background-text {
    position: absolute;

    top: 7%;
    width: 100%;

    text-align: center;

    font-family: "Courier Prime", monospace;
    font-size: 10px;

    letter-spacing: 0.35em;
    text-transform: uppercase;

    color: #7d7566;

    opacity: 0.75;
}


/* =====================================================
   FULL PAGE LETTER
===================================================== */

.letter-opening {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255,255,255,0.7),
            transparent 45%
        ),
        #f7f2e7;
}


.letter-opening-content {
    width: min(900px, 90vw);

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* =====================================================
   OPENING TEXT
===================================================== */

.letter-small {
    font-family: "Courier Prime", monospace;

    font-size: 11px;

    letter-spacing: 0.35em;

    text-transform: uppercase;

    color: #8b816f;

    margin-bottom: 28px;
}


.letter-title {
    font-family: "Caveat", cursive;

    font-size: clamp(
        65px,
        8vw,
        105px
    );

    font-weight: 500;

    color: #263247;

    line-height: 1;

    margin-bottom: 20px;
}


.letter-line {
    width: 62px;
    height: 1px;

    background: #a9762f;

    margin: 0 auto 28px;
}


.letter-text {
    font-family: "Cormorant Garamond", serif;

    font-size: clamp(
        22px,
        2.5vw,
        30px
    );

    font-style: italic;

    color: #4d5360;

    margin-bottom: 0;
}


/* =====================================================
   ROAST BUTTON
===================================================== */

.roast-button {
    margin-top: 55px;

    padding: 14px 30px;

    border: 1px solid #263247;

    border-radius: 0;

    background: transparent;

    color: #263247;

    font-family: "Courier Prime", monospace;

    font-size: 12px;

    letter-spacing: 0.14em;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.25s ease,
        letter-spacing 0.25s ease;
}


.roast-button:hover {
    background: #263247;

    color: #f7f2e7;

    transform: translateY(-2px);

    letter-spacing: 0.18em;
}


/* =====================================================
   FORAM PANEL SCREEN
===================================================== */

.foram-screen {
    position: fixed;

    inset: 0;

    z-index: 20;

    background: #f7f2e7;

    display: flex;

    align-items: center;

    justify-content: center;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
}


.foram-screen.visible {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* =====================================================
   FORAM SVG
===================================================== */

.foram-svg {
    width: 100vw;

    height: 100vh;

    overflow: visible;
}


/* =====================================================
   PHOTO PANELS
===================================================== */

.photo-panel {
    cursor: pointer;

    transition:
        opacity 0.35s ease,
        filter 0.35s ease;
}


/* dark overlay */

.photo-overlay {
    fill: rgba(0,0,0,0.12);

    pointer-events: none;

    transition:
        fill 0.35s ease;
}


/* hover effect */

.panel-group:hover .photo-overlay {
    fill: rgba(169,118,47,0.18);
}


.panel-group:hover .photo-panel {
    filter:
        brightness(1.08)
        saturate(1.08);
}


/* =====================================================
   PANEL OUTLINES
===================================================== */

.panel-outline {
    fill: none;

    stroke: #111;

    stroke-width: 3;

    stroke-linejoin: round;

    vector-effect: non-scaling-stroke;

    transition:
        stroke 0.3s ease,
        stroke-width 0.3s ease;
}


.panel-group:hover .panel-outline {
    stroke: #a9762f;

    stroke-width: 5;
}


/* =====================================================
   FORAM LETTERS
===================================================== */

.foram-letter {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 92px;

    font-weight: 400;

    fill: white;

    stroke: rgba(0,0,0,0.15);

    stroke-width: 1;

    paint-order: stroke fill;

    text-anchor: middle;

    pointer-events: none;

    transition:
        transform 0.35s ease,
        fill 0.35s ease;
}


.panel-group:hover .foram-letter {
    fill: #ffffff;

    transform:
        translateY(-5px)
        scale(1.08);
}


/* =====================================================
   WORDS
===================================================== */

.foram-word {
    font-family:
        "Courier Prime",
        monospace;

    font-size: 23px;

    letter-spacing: 0.08em;

    fill: white;

    text-anchor: middle;

    pointer-events: none;

    paint-order: stroke fill;

    stroke: rgba(0,0,0,0.25);

    stroke-width: 0.8;
}


/* =====================================================
   INDIVIDUAL LETTER SCREEN
===================================================== */

.letter-screen {
    position: fixed;

    inset: 0;

    z-index: 30;

    background: #f7f2e7;

    display: flex;

    align-items: center;

    justify-content: center;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
}


.letter-screen.visible {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


.letter-screen-content {
    width: min(750px, 88vw);

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* BIG LETTER */

.letter-screen-letter {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: clamp(
        140px,
        20vw,
        230px
    );

    font-weight: 400;

    line-height: 0.8;

    color: #263247;

    margin-bottom: 25px;
}


/* WORD */

.letter-screen-word {
    font-family:
        "Courier Prime",
        monospace;

    font-size: 20px;

    letter-spacing: 0.2em;

    text-transform: uppercase;

    color: #a9762f;

    margin-bottom: 50px;
}


/* ROAST */

.letter-screen-roast {
    max-width: 600px;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: clamp(
        25px,
        3vw,
        34px
    );

    font-style: italic;

    line-height: 1.45;

    color: #4d5360;

    margin-bottom: 60px;
}


/* NEXT BUTTON */

.next-letter-button {
    padding: 14px 32px;

    border: 1px solid #263247;

    border-radius: 0;

    background: transparent;

    color: #263247;

    font-family:
        "Courier Prime",
        monospace;

    font-size: 12px;

    letter-spacing: 0.16em;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.25s ease;
}


.next-letter-button:hover {
    background: #263247;

    color: #f7f2e7;

    transform: translateY(-2px);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .letter-small {
        font-size: 9px;
    }

    .letter-text {
        padding: 0 20px;
    }

    .foram-letter {
        font-size: 75px;
    }

    .foram-word {
        font-size: 17px;
    }

    .letter-screen-roast {
        font-size: 23px;

        padding: 0 15px;
    }

    .letter-screen-word {
        font-size: 15px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     OPENING PAGE
===================================================== -->

<section class="stage" id="openingScreen">

    <div class="background-text">
        Opened at your own risk
    </div>

    <div class="letter-opening">

        <div class="letter-opening-content">

            <div class="letter-small">
                Opened at your own risk
            </div>

            <div class="letter-title">
                For Foram
            </div>

            <div class="letter-line"></div>

            <div class="letter-text">
                Some things deserve a proper introduction.
            </div>

            <button
                class="roast-button"
                onclick="showForam()"
            >
                I am ready to be roasted
            </button>

        </div>

    </div>

</section>



<!-- =====================================================
     FORAM PANEL PAGE
===================================================== -->

<section
    class="foram-screen"
    id="foramScreen"
>


<svg
    class="foram-svg"
    viewBox="0 0 1500 700"
    preserveAspectRatio="xMidYMid slice"
>


<!-- =====================================================
     F
===================================================== -->

<defs>

    <clipPath id="clipF">
        <polygon
            points="0,70 300,70 250,630 0,630"
        />
    </clipPath>

    <clipPath id="clipO">
        <polygon
            points="300,70 600,70 550,630 250,630"
        />
    </clipPath>

    <clipPath id="clipR">
        <polygon
            points="600,70 900,70 850,630 550,630"
        />
    </clipPath>

    <clipPath id="clipA">
        <polygon
            points="900,70 1200,70 1150,630 850,630"
        />
    </clipPath>

    <clipPath id="clipM">
        <polygon
            points="1200,70 1500,70 1450,630 1150,630"
        />
    </clipPath>

</defs>


<!-- F -->

<g
    class="panel-group"
    onclick="openLetter('F')"
>

    <image
        class="photo-panel"
        href="F.jpg"
        x="0"
        y="0"
        width="350"
        height="700"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#clipF)"
    />

    <polygon
        class="photo-overlay"
        points="0,70 300,70 250,630 0,630"
    />

    <path
        class="panel-outline"
        d="M 0 70 L 300 70 L 250 630 L 0 630 Z"
    />

    <text
        class="foram-letter"
        x="150"
        y="360"
    >
        F
    </text>

    <text
        class="foram-word"
        x="150"
        y="450"
    >
        Funny
    </text>

</g>



<!-- O -->

<g
    class="panel-group"
    onclick="openLetter('O')"
>

    <image
        class="photo-panel"
        href="O.jpg"
        x="250"
        y="0"
        width="350"
        height="700"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#clipO)"
    />

    <polygon
        class="photo-overlay"
        points="300,70 600,70 550,630 250,630"
    />

    <path
        class="panel-outline"
        d="M 300 70 L 600 70 L 550 630 L 250 630 Z"
    />

    <text
        class="foram-letter"
        x="450"
        y="360"
    >
        O
    </text>

    <text
        class="foram-word"
        x="450"
        y="450"
    >
        Overthinker
    </text>

</g>



<!-- R -->

<g
    class="panel-group"
    onclick="openLetter('R')"
>

    <image
        class="photo-panel"
        href="R.jpg"
        x="550"
        y="0"
        width="350"
        height="700"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#clipR)"
    />

    <polygon
        class="photo-overlay"
        points="600,70 900,70 850,630 550,630"
    />

    <path
        class="panel-outline"
        d="M 600 70 L 900 70 L 850 630 L 550 630 Z"
    />

    <text
        class="foram-letter"
        x="750"
        y="360"
    >
        R
    </text>

    <text
        class="foram-word"
        x="750"
        y="450"
    >
        Reckless
    </text>

</g>



<!-- A -->

<g
    class="panel-group"
    onclick="openLetter('A')"
>

    <image
        class="photo-panel"
        href="A.jpg"
        x="850"
        y="0"
        width="350"
        height="700"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#clipA)"
    />

    <polygon
        class="photo-overlay"
        points="900,70 1200,70 1150,630 850,630"
    />

    <path
        class="panel-outline"
        d="M 900 70 L 1200 70 L 1150 630 L 850 630 Z"
    />

    <text
        class="foram-letter"
        x="1050"
        y="360"
    >
        A
    </text>

    <text
        class="foram-word"
        x="1050"
        y="450"
    >
        Attitude
    </text>

</g>



<!-- M -->

<g
    class="panel-group"
    onclick="openLetter('M')"
>

    <image
        class="photo-panel"
        href="M.jpg"
        x="1150"
        y="0"
        width="350"
        height="700"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#clipM)"
    />

    <polygon
        class="photo-overlay"
        points="1200,70 1500,70 1450,630 1150,630"
    />

    <path
        class="panel-outline"
        d="M 1200 70 L 1500 70 L 1450 630 L 1150 630 Z"
    />

    <text
        class="foram-letter"
        x="1350"
        y="360"
    >
        M
    </text>

    <text
        class="foram-word"
        x="1350"
        y="450"
    >
        Menace
    </text>

</g>


</svg>

</section>



<!-- =====================================================
     INDIVIDUAL LETTER SCREEN
===================================================== -->

<section
    class="letter-screen"
    id="letterScreen"
>

    <div class="letter-screen-content">

        <div
            class="letter-screen-letter"
            id="letterScreenLetter"
        >
            F
        </div>


        <div
            class="letter-screen-word"
            id="letterScreenWord"
        >
            Funny
        </div>


        <div class="letter-screen-roast">

            <p id="roastText">
                Thinks she's hilarious.
                Unfortunately, she's right.
            </p>

        </div>


        <button
            class="next-letter-button"
            id="nextLetterButton"
            onclick="nextLetter()"
        >
            Next: O
        </button>

    </div>

</section>



<script>


/* =====================================================
   SHOW FORAM PAGE
===================================================== */

function showForam() {

    const opening =
        document.getElementById("openingScreen");

    const foram =
        document.getElementById("foramScreen");

    opening.style.opacity = "0";

    setTimeout(function() {

        opening.style.visibility = "hidden";

        foram.classList.add("visible");

    }, 700);

}


/* =====================================================
   LETTER DATA
===================================================== */

const letterData = {

    F: {
        word: "Funny",
        roast:
            "Thinks she's hilarious. Unfortunately, she's right.",
        next: "Next: O"
    },

    O: {
        word: "Overthinker",
        roast:
            "Can find seventeen possible meanings in a two-word message.",
        next: "Next: R"
    },

    R: {
        word: "Reckless",
        roast:
            "Common sense is merely a suggestion.",
        next: "Next: A"
    },

    A: {
        word: "Attitude",
        roast:
            "Comes free with every opinion. No returns accepted.",
        next: "Next: M"
    },

    M: {
        word: "Menace",
        roast:
            "Looks harmless. That is the first mistake.",
        next: "Finish"
    }

};


let currentLetter = null;


/* =====================================================
   OPEN INDIVIDUAL LETTER
===================================================== */

function openLetter(letter) {

    currentLetter = letter;

    const screen =
        document.getElementById("letterScreen");

    const letterElement =
        document.getElementById("letterScreenLetter");

    const wordElement =
        document.getElementById("letterScreenWord");

    const roastElement =
        document.getElementById("roastText");

    const button =
        document.getElementById("nextLetterButton");


    const data = letterData[letter];

    if (!data) return;


    letterElement.textContent =
        letter;

    wordElement.textContent =
        data.word;

    roastElement.textContent =
        data.roast;

    button.textContent =
        data.next;


    screen.classList.add("visible");

}


/* =====================================================
   NEXT LETTER
===================================================== */

function nextLetter() {

    const order =
        ["F", "O", "R", "A", "M"];


    const currentIndex =
        order.indexOf(currentLetter);


    if (currentIndex === -1) {
        return;
    }


    if (currentIndex === order.length - 1) {

        /* M is finished */

        return;
    }


    openLetter(
        order[currentIndex + 1]
    );

}


</script>

</body>
</html>
