<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>A Letter for Foram</title>


<style>

/* =====================================================
   FONTS
===================================================== */

@import url(
    'https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap'
);


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {
    width: 100%;
    height: 100%;
}


body {
    min-height: 100vh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255,255,255,0.7),
            transparent 45%
        ),
        #e8e1d2;

    color: #202b3d;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background {
    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 0;
}


.grain {
    position: absolute;

    inset: 0;

    opacity: 0.18;

    background-image:
        radial-gradient(
            rgba(0,0,0,0.18) 0.6px,
            transparent 0.6px
        );

    background-size: 5px 5px;

    mix-blend-mode: multiply;
}


.background-text {
    position: absolute;

    width: 100%;

    text-align: center;

    top: 8%;

    font-family:
        "Courier Prime",
        monospace;

    font-size: 11px;

    letter-spacing: 0.35em;

    text-transform: uppercase;

    color: #7d7566;

    opacity: 0.7;
}


/* =====================================================
   MAIN STAGE
===================================================== */

.stage {
    position: relative;

    width: 100%;

    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    perspective: 1200px;

    z-index: 1;

    transition:
        opacity 0.7s ease;
}


/* =====================================================
   ENVELOPE
===================================================== */

.envelope-wrapper {
    position: relative;

    width: min(78vw, 520px);

    aspect-ratio: 1.55 / 1;

    cursor: pointer;

    transform-style: preserve-3d;

    animation:
        float 4s ease-in-out infinite;
}


@keyframes float {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }

}


.envelope-wrapper.opened {
    animation: none;
}


.envelope {
    position: absolute;

    inset: 0;

    background: #efe8d8;

    border: 1px solid #bdb39f;

    box-shadow:
        0 25px 50px rgba(45,40,30,0.18),
        0 5px 10px rgba(45,40,30,0.08);

    transform-style: preserve-3d;

    overflow: visible;
}


/* =====================================================
   ENVELOPE FRONT
===================================================== */

.envelope-front {
    position: absolute;

    inset: 0;

    z-index: 4;

    background:
        linear-gradient(
            135deg,
            transparent 49.7%,
            #d9d0bd 50%,
            transparent 50.3%
        ),
        linear-gradient(
            225deg,
            transparent 49.7%,
            #d9d0bd 50%,
            transparent 50.3%
        ),
        #eee7d8;

    border: 1px solid #bdb39f;

    pointer-events: none;
}


/* =====================================================
   LOWER FOLDS
===================================================== */

.fold-left {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 50%;
    height: 70%;

    background: #e5dccb;

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );

    z-index: 5;

    border-left: 1px solid #c9bfae;
}


.fold-right {
    position: absolute;

    bottom: 0;
    right: 0;

    width: 50%;
    height: 70%;

    background: #e2d9c8;

    clip-path:
        polygon(
            0 100%,
            100% 0,
            100% 100%
        );

    z-index: 5;

    border-right: 1px solid #c9bfae;
}


/* =====================================================
   LETTER INSIDE ENVELOPE
===================================================== */

.letter {
    position: absolute;

    width: 86%;
    height: 88%;

    left: 7%;
    bottom: 4%;

    z-index: 2;

    background: #f7f2e7;

    border: 1px solid #cfc4ae;

    box-shadow:
        0 8px 20px rgba(30,25,15,0.12);

    padding: 30px;

    transform:
        translateY(25%);

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1);

    pointer-events: auto;
}


.letter-content {
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    font-family:
        "Cormorant Garamond",
        serif;
}


.letter-small {
    font-family:
        "Courier Prime",
        monospace;

    font-size: 9px;

    letter-spacing: 0.3em;

    text-transform: uppercase;

    color: #8b816f;

    margin-bottom: 20px;
}


.letter-title {
    font-family:
        "Caveat",
        cursive;

    font-size:
        clamp(30px, 7vw, 48px);

    color: #263247;

    margin-bottom: 10px;
}


.letter-line {
    width: 50px;

    height: 1px;

    background: #a9762f;

    margin: 15px auto;
}


.letter-text {
    font-style: italic;

    font-size: 17px;

    color: #4d5360;
}


/* =====================================================
   DIVIDER ABOVE BUTTON
===================================================== */

.button-divider {
    width: 45px;

    height: 1px;

    background: #a9762f;

    margin:
        24px auto 0;
}


/* =====================================================
   ROAST BUTTON
===================================================== */

.roast-button {
    display: inline-block;

    margin-top: 18px;

    padding:
        11px 24px;

    border:
        1px solid #263247;

    border-radius: 0;

    background: transparent;

    color: #263247;

    font-family:
        "Courier Prime",
        monospace;

    font-size: 11px;

    font-weight: 400;

    letter-spacing: 0.16em;

    text-transform: uppercase;

    cursor: pointer;

    appearance: none;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.25s ease,
        letter-spacing 0.25s ease;
}


.roast-button:hover {
    background: #263247;

    color: #f7f2e7;

    transform:
        translateY(-2px);

    letter-spacing: 0.20em;
}


.roast-button:active {
    transform:
        translateY(0);
}


/* =====================================================
   OPENING FLAP
===================================================== */

.flap {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 58%;

    z-index: 7;

    background: #eee6d6;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:
        top center;

    transform:
        rotateX(0deg);

    transition:
        transform 1.1s cubic-bezier(.4,0,.2,1);

    backface-visibility: hidden;

    filter:
        drop-shadow(
            0 3px 3px
            rgba(40,35,25,0.08)
        );
}


.flap::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.3),
            transparent 45%
        );
}


/* =====================================================
   WAX SEAL
===================================================== */

.seal {
    position: absolute;

    left: 50%;
    top: 52%;

    transform:
        translate(-50%, -50%);

    width: 72px;
    height: 72px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #c74437,
            #922b24 70%
        );

    border:
        2px solid #762019;

    box-shadow:
        0 4px 8px
        rgba(50,20,15,0.25);

    z-index: 10;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #f4d7c8;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 24px;

    font-weight: 600;

    transition:
        transform 0.4s ease,
        opacity 0.4s ease;
}


.seal::before {
    content: "";

    position: absolute;

    inset: 6px;

    border:
        1px solid
        rgba(255,220,210,0.45);

    border-radius: 50%;
}


/* =====================================================
   ENVELOPE OPEN STATE
===================================================== */

.envelope-wrapper.opened .flap {

    transform:
        rotateX(180deg);

    z-index: 1;
}


.envelope-wrapper.opened .letter {

    transform:
        translateY(-48%);

    z-index: 8;
}


.envelope-wrapper.opened .seal {

    transform:
        translate(-50%, -50%)
        scale(0.65);

    opacity: 0;
}


/* =====================================================
   INSTRUCTION
===================================================== */

.instruction {
    position: absolute;

    bottom: 11%;

    width: 100%;

    text-align: center;

    font-family:
        "Courier Prime",
        monospace;

    font-size: 10px;

    letter-spacing: 0.22em;

    text-transform: uppercase;

    color: #756d5f;

    transition:
        opacity 0.5s ease;
}


.envelope-wrapper.opened
~ .instruction {

    opacity: 0;
}


/* =====================================================
   DECORATIVE MARK
===================================================== */

.corner-mark {
    position: absolute;

    bottom: 7%;

    left: 50%;

    transform:
        translateX(-50%);

    font-family:
        "Caveat",
        cursive;

    font-size: 20px;

    color: #a9762f;

    opacity: 0.75;
}


/* =====================================================
   FORAM FULL SCREEN
===================================================== */

.foram-screen {

    position: fixed;

    inset: 0;

    z-index: 100;

    background: #f7f2e7;

    display: flex;

    align-items: center;

    justify-content: center;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
}


.foram-screen.visible {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* =====================================================
   FORAM SVG
===================================================== */

.foram-svg {

    width: 100vw;

    height: 100vh;

    display: block;

    overflow: visible;
}


/* =====================================================
   PHOTO
===================================================== */

.panel-photo {

    pointer-events: none;

    opacity: 0.92;

    transition:
        opacity 0.35s ease,
        filter 0.35s ease;
}


.panel-group:hover .panel-photo {

    opacity: 1;

    filter:
        brightness(1.08)
        saturate(1.08);
}


/* =====================================================
   PHOTO OVERLAY
===================================================== */

.photo-overlay {

    fill:
        rgba(0,0,0,0.12);

    pointer-events: none;

    transition:
        fill 0.35s ease;
}


.panel-group:hover .photo-overlay {

    fill:
        rgba(169,118,47,0.18);
}


/* =====================================================
   PANEL OUTLINE
===================================================== */

.panel-outline {

    fill: none;

    stroke: #080808;

    stroke-width: 3.5;

    stroke-linecap: round;

    stroke-linejoin: round;

    vector-effect:
        non-scaling-stroke;

    transition:
        stroke 0.3s ease,
        stroke-width 0.3s ease;
}


.panel-group:hover .panel-outline {

    stroke: #a9762f;

    stroke-width: 5;
}


/* =====================================================
   FORAM LETTERS
===================================================== */

.foram-letter {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 82px;

    font-weight: 400;

    fill: #ffffff;

    stroke:
        rgba(0,0,0,0.35);

    stroke-width: 1;

    paint-order:
        stroke fill;

    text-anchor: middle;

    pointer-events: none;

    opacity: 0;

    transform-box:
        fill-box;

    transform-origin:
        center;

    transform:
        translateY(12px);

    transition:
        opacity 0.45s ease,
        transform 0.3s ease,
        fill 0.3s ease;
}


.foram-screen.visible
.foram-letter {

    opacity: 1;

    transform:
        translateY(0);
}


.panel-group:hover
.foram-letter {

    fill: #ffffff;

    transform:
        translateY(-4px)
        scale(1.06);
}


/* stagger */

.foram-screen.visible
.letter-1 {

    transition-delay:
        0.15s;
}


.foram-screen.visible
.letter-2 {

    transition-delay:
        0.25s;
}


.foram-screen.visible
.letter-3 {

    transition-delay:
        0.35s;
}


.foram-screen.visible
.letter-4 {

    transition-delay:
        0.45s;
}


.foram-screen.visible
.letter-5 {

    transition-delay:
        0.55s;
}


/* =====================================================
   FORAM WORDS
===================================================== */

.foram-word {

    font-family:
        "Courier Prime",
        monospace;

    font-size: 22px;

    letter-spacing:
        0.08em;

    fill: #ffffff;

    text-anchor: middle;

    pointer-events: none;

    paint-order:
        stroke fill;

    stroke:
        rgba(0,0,0,0.35);

    stroke-width: 0.8;

    opacity: 0;

    transition:
        opacity 0.5s ease;
}


.foram-screen.visible
.foram-word {

    opacity: 1;
}


/* =====================================================
   INDIVIDUAL ROAST SCREEN
===================================================== */

.letter-screen {

    position: fixed;

    inset: 0;

    z-index: 200;

    background: #f7f2e7;

    display: flex;

    align-items: center;

    justify-content: center;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
}


.letter-screen.visible {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


.letter-screen-content {

    width:
        min(750px, 88vw);

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* big letter */

.letter-screen-letter {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(120px, 18vw, 210px);

    font-weight: 400;

    line-height: 0.8;

    color: #263247;

    margin-bottom: 25px;
}


/* word */

.letter-screen-word {

    font-family:
        "Courier Prime",
        monospace;

    font-size: 18px;

    letter-spacing: 0.18em;

    text-transform: uppercase;

    color: #a9762f;

    margin-bottom: 48px;
}


/* roast */

.letter-screen-roast {

    max-width: 600px;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(24px, 3vw, 32px);

    font-style: italic;

    line-height: 1.45;

    color: #4d5360;

    margin-bottom: 55px;
}


/* next */

.next-letter-button {

    padding:
        12px 28px;

    border:
        1px solid #263247;

    border-radius: 0;

    background: transparent;

    color: #263247;

    font-family:
        "Courier Prime",
        monospace;

    font-size: 11px;

    letter-spacing: 0.16em;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.25s ease;
}


.next-letter-button:hover {

    background: #263247;

    color: #f7f2e7;

    transform:
        translateY(-2px);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .envelope-wrapper {

        width: 84vw;
    }


    .letter {

        padding: 20px;
    }


    .seal {

        width: 62px;
        height: 62px;
    }


    .instruction {

        bottom: 12%;
    }


    .foram-letter {

        font-size: 70px;
    }


    .foram-word {

        font-size: 15px;
    }


    .letter-screen-roast {

        padding:
            0 15px;

        font-size: 22px;
    }

}

</style>

</head>

<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="grain"></div>

    <div class="background-text">
        A little something, properly delivered
    </div>

</div>



<!-- =====================================================
     ENVELOPE SCREEN
===================================================== -->

<main class="stage" id="stage">


    <div
        class="envelope-wrapper"
        id="envelope"
        onclick="openEnvelope()"
    >


        <div class="envelope">


            <!-- LETTER -->

            <div class="letter">

                <div class="letter-content">


                    <div class="letter-small">
                        Opened at your own risk
                    </div>


                    <div class="letter-title">
                        For Foram
                    </div>


                    <div class="letter-line"></div>


                    <div class="letter-text">
                        Some things deserve a proper introduction.
                    </div>


                    <div class="button-divider"></div>


                    <button
                        class="roast-button"
                        onclick="showForam(event)"
                    >
                        I am ready to be roasted
                    </button>


                </div>

            </div>


            <!-- ENVELOPE BODY -->

            <div class="envelope-front"></div>


            <div class="fold-left"></div>

            <div class="fold-right"></div>


            <!-- OPENING FLAP -->

            <div class="flap"></div>


            <!-- WAX SEAL -->

            <div class="seal">
                F
            </div>


        </div>

    </div>


    <div class="instruction">
        Tap the seal to open
    </div>


    <div class="corner-mark">
        ✦
    </div>


</main>



<!-- =====================================================
     FORAM PHOTO SCREEN
===================================================== -->

<section
    class="foram-screen"
    id="foramScreen"
>


<svg
    class="foram-svg"
    viewBox="0 0 1500 500"
    preserveAspectRatio="xMidYMid meet"
    aria-label="FORAM"
>


<defs>

    <clipPath id="clipF">

        <polygon
            points="
                80,70
                350,70

        "
    />


    <path
        class="panel-outline"
        d="
            M 1180 70
            L 1470 70
            L 1400 430
            L 1130 430
            Z
        "
    />


    <text
        class="foram-letter letter-5"
        x="1290"
        y="315"
    >
        M
    </text>


    <text
        class="foram-word"
        x="1290"
        y="365"
    >
        Menace
    </text>


</g>


</svg>

</section>



<!-- =====================================================
     INDIVIDUAL ROAST SCREEN
===================================================== -->

<section
    class="letter-screen"
    id="letterScreen"
>


    <div class="letter-screen-content">


        <div
            class="letter-screen-letter"
            id="letterScreenLetter"
        >
            F
        </div>


        <div
            class="letter-screen-word"
            id="letterScreenWord"
        >
            Funny
        </div>


        <div class="letter-screen-roast">

            <p id="roastText">
                Thinks she's hilarious.
                Unfortunately, she's right.
            </p>

        </div>


        <button
            class="next-letter-button"
            id="nextLetterButton"
            onclick="nextLetter()"
        >
            Next: O
        </button>


    </div>

</section>



<script>


/* =====================================================
   ENVELOPE OPENING
===================================================== */

let opened = false;


function openEnvelope() {

    if (opened) {
        return;
    }


    opened = true;


    const envelope =
        document.getElementById(
            "envelope"
        );


    envelope.classList.add(
        "opened"
    );

}



/* =====================================================
   SHOW FORAM
===================================================== */

function showForam(event) {

    /*
       Stop the button click from
       triggering openEnvelope()
       again.
    */

    event.stopPropagation();


    const stage =
        document.getElementById(
            "stage"
        );


    const foramScreen =
        document.getElementById(
            "foramScreen"
        );


    stage.style.opacity = "0";


    setTimeout(function() {

        stage.style.visibility =
            "hidden";

        stage.style.pointerEvents =
            "none";


        foramScreen.classList.add(
            "visible"
        );

    }, 700);

}



/* =====================================================
   ROAST DATA
===================================================== */

const letterData = {


    F: {

        word: "Funny",

        roast:
            "Thinks she's hilarious. Unfortunately, she's right.",

        next:
            "Next: O"

    },


    O: {

        word: "Overthinker",

        roast:
            "Can find seventeen possible meanings in a two-word message.",

        next:
            "Next: R"

    },


    R: {

        word: "Reckless",

        roast:
            "Common sense is merely a suggestion.",

        next:
            "Next: A"

    },


    A: {

        word: "Attitude",

        roast:
            "Comes free with every opinion. No returns accepted.",

        next:
            "Next: M"

    },


    M: {

        word: "Menace",

        roast:
            "Looks harmless. That is the first mistake.",

        next:
            "Finish"

    }

};


let currentLetter = null;



/* =====================================================
   OPEN INDIVIDUAL LETTER
===================================================== */

function openLetter(letter) {


    currentLetter = letter;


    const screen =
        document.getElementById(
            "letterScreen"
        );


    const letterElement =
        document.getElementById(
            "letterScreenLetter"
        );


    const wordElement =
        document.getElementById(
            "letterScreenWord"
        );


    const roastElement =
        document.getElementById(
            "roastText"
        );


    const button =
        document.getElementById(
            "nextLetterButton"
        );


    const data =
        letterData[letter];


    if (!data) {
        return;
    }


    letterElement.textContent =
        letter;


    wordElement.textContent =
        data.word;


    roastElement.textContent =
        data.roast;


    button.textContent =
        data.next;


    screen.classList.add(
        "visible"
    );

}



/* =====================================================
   NEXT LETTER
===================================================== */

function nextLetter() {


    const order = [
        "F",
        "O",
        "R",
        "A",
        "M"
    ];


    const currentIndex =
        order.indexOf(
            currentLetter
        );


    if (currentIndex === -1) {
        return;
    }


    /*
       For now M is the final screen.
    */

    if (
        currentIndex ===
        order.length - 1
    ) {

        return;

    }


    const next =
        order[
            currentIndex + 1
        ];


    openLetter(next);

}


</script>


</body>

</html>
