<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Foram</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Courier+Prime:wght@400&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #f7f2e7;
    color: #263247;
    overflow: hidden;
}

/* =========================================
   ENVELOPE / INTRO
========================================= */

.stage {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f7f2e7;
}

.envelope-wrapper {
    position: relative;

    width: min(760px, 85vw);
    height: min(480px, 60vh);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.envelope {
    position: relative;

    width: 500px;
    height: 320px;

    background: #eee4d0;

    border: 1px solid #263247;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.08);

    overflow: hidden;
}

.envelope-front {
    position: absolute;
    inset: 0;

    background: #eee4d0;

    clip-path: polygon(
        0 0,
        100% 0,
        50% 58%
    );

    border-bottom: 1px solid #263247;

    z-index: 3;
}

.envelope-back {
    position: absolute;
    inset: 0;

    background: #eee4d0;

    z-index: 1;
}

.envelope-letter {
    position: absolute;

    left: 50%;
    bottom: 20px;

    width: 88%;
    height: 76%;

    transform:
        translateX(-50%)
        translateY(110%);

    background: #fffdf7;

    border: 1px solid #263247;

    z-index: 2;

    transition:
        transform 1s ease;
}

.envelope-wrapper.open .envelope-letter {
    transform:
        translateX(-50%)
        translateY(0);
}

.envelope-wrapper.open .envelope-front {
    transform: rotateX(180deg);
    transform-origin: top;
}

/* =========================================
   LETTER
========================================= */

.letter-content {
    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;
}

.letter-small {
    font-family: "Courier Prime", monospace;

    font-size: 10px;
    letter-spacing: 0.35em;

    text-transform: uppercase;

    color: #9b927f;

    margin-bottom: 32px;
}

.letter-title {
    font-family:
        "Cormorant Garamond",
        serif;

    font-size: clamp(60px, 8vw, 100px);

    font-style: italic;

    color: #263247;

    margin: 0 0 25px;
}

.letter-divider {
    width: 62px;
    height: 1px;

    background: #a9762f;

    margin-bottom: 24px;
}

.letter-text {
    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 22px;

    font-style: italic;

    color: #59606c;

    margin: 0;
}

.roast-button {
    display: inline-block;

    margin-top: 45px;

    padding: 11px 24px;

    border: 1px solid #263247;
    border-radius: 0;

    background: transparent;

    color: #263247;

    font-family: "Courier Prime", monospace;

    font-size: 11px;
    font-weight: 400;

    letter-spacing: 0.16em;

    text-transform: uppercase;

    cursor: pointer;

    appearance: none;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.25s ease,
        letter-spacing 0.25s ease;
}

.roast-button:hover {
    background: #263247;
    color: #f7f2e7;

    transform: translateY(-2px);

    letter-spacing: 0.18em;
}

.roast-button:active {
    transform: translateY(0);
}

/* =========================================
   FORAM SCREEN
========================================= */

.foram-screen {
    position: fixed;

    inset: 0;

    z-index: 100;

    background: #f7f2e7;

    display: flex;

    align-items: center;
    justify-content: center;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
}

.foram-screen.visible {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

.foram-svg {
    width: 100vw;
    height: 100vh;

    display: block;
}

.foram-panel {
    fill: transparent;

    stroke: #050505;

    stroke-width: 3;

    transition:
        fill 0.3s ease;
}

.panel-group {
    cursor: pointer;
}

.panel-group:hover .foram-panel {
    fill: rgba(169, 118, 47, 0.08);
}

.foram-letter {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 82px;

    font-weight: 400;

    fill: #050505;

    text-anchor: middle;

    pointer-events: none;

    opacity: 0;

    transform-box: fill-box;

    transform-origin: center;

    transform: translateY(12px);

    transition:
        opacity 0.45s ease,
        transform 0.3s ease,
        fill 0.3s ease;
}

.foram-screen.visible .foram-letter {
    opacity: 1;

    transform: translateY(0);
}

.foram-word {
    font-family:
        "Courier Prime",
        monospace;

    font-size: 22px;

    letter-spacing: 0.08em;

    fill: #050505;

    text-anchor: middle;

    opacity: 0;

    transition:
        opacity 0.45s ease,
        transform 0.3s ease;
}

.foram-screen.visible .word-1 {
    opacity: 1;
    transition-delay: 0.35s;
}

.foram-screen.visible .word-2 {
    opacity: 1;
    transition-delay: 0.50s;
}

.foram-screen.visible .word-3 {
    opacity: 1;
    transition-delay: 0.65s;
}

.foram-screen.visible .word-4 {
    opacity: 1;
    transition-delay: 0.80s;
}

.foram-screen.visible .word-5 {
    opacity: 1;
    transition-delay: 0.95s;
}

/* =========================================
   INDIVIDUAL LETTER SCREENS
========================================= */

.letter-screen {
    position: fixed;

    inset: 0;

    z-index: 200;

    background: #f7f2e7;

    display: flex;

    align-items: center;
    justify-content: center;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
}

.letter-screen.visible {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

.letter-screen-content {
    width: min(700px, 85vw);

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;
}

.letter-screen-letter {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: clamp(100px, 15vw, 180px);

    font-weight: 400;

    color: #263247;

    line-height: 0.9;

    margin-bottom: 15px;
}

.letter-screen-word {
    font-family:
        "Courier Prime",
        monospace;

    font-size: 18px;

    letter-spacing: 0.18em;

    text-transform: uppercase;

    color: #a9762f;

    margin-bottom: 45px;
}

.letter-screen-roast {
    max-width: 520px;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 24px;

    font-style: italic;

    line-height: 1.5;

    color: #4d5360;

    margin-bottom: 55px;
}

.next-letter-button {
    padding: 12px 28px;

    border: 1px solid #263247;

    border-radius: 0;

    background: transparent;

    color: #263247;

    font-family:
        "Courier Prime",
        monospace;

    font-size: 11px;

    font-weight: 400;

    letter-spacing: 0.16em;

    text-transform: uppercase;

    cursor: pointer;

    appearance: none;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.25s ease;
}

.next-letter-button:hover {
    background: #263247;

    color: #f7f2e7;

    transform: translateY(-2px);
}

.next-letter-button:active {
    transform: translateY(0);
}

@media (max-width: 600px) {

    .letter-screen-roast {
        font-size: 20px;

        padding: 0 10px;
    }

    .letter-screen-word {
        font-size: 15px;
    }

}

</style>
</head>

<body>

<!-- =========================================
     INTRO / ENVELOPE
========================================= -->

<main class="stage">

    <div
        class="envelope-wrapper"
        id="envelopeWrapper"
        onclick="openEnvelope()"
    >

        <div class="envelope">

            <div class="envelope-back"></div>

            <div class="envelope-letter">

                <div class="letter-content">

                    <div class="letter-small">
                        Opened at your own risk
                    </div>

                    <h1 class="letter-title">
                        For Foram
                    </h1>

                    <div class="letter-divider"></div>

                    <p class="letter-text">
                        Some things deserve a proper introduction.
                    </p>

                    <button
                        class="roast-button"
                        onclick="showForam(event)"
                    >
                        I am ready to be roasted
                    </button>

                </div>

            </div>

            <div class="envelope-front"></div>

        </div>

    </div>

</main>


<!-- =========================================
     FORAM
========================================= -->

<section
    class="foram-screen"
    id="foramScreen"
>

<svg
    class="foram-svg"
    viewBox="0 0 1500 500"
    preserveAspectRatio="none"
>

    <!-- F -->

    <g
        class="panel-group"
        onclick="openLetter('F')"
    >

        <polygon
            class="foram-panel"
            points="80,70 350,70 290,430 20,430"
        />

        <path
            d="M 80 70 L 350 70 L 290 430 L 20 430 Z"
            fill="none"
            stroke="#050505"
            stroke-width="3"
        />

        <text
            class="foram-letter letter-1"
            x="185"
            y="260"
        >F</text>

        <text
            class="foram-word word-1"
            x="185"
            y="330"
        >Funny</text>

    </g>


    <!-- O -->

    <g
        class="panel-group"
        onclick="openLetter('O')"
    >

        <polygon
            class="foram-panel"
            points="350,70 650,70 590,430 290,430"
        />

        <path
            d="M 350 70 L 650 70 L 590 430 L 290 430"
            fill="none"
            stroke="#050505"
            stroke-width="3"
        />

        <text
            class="foram-letter letter-2"
            x="470"
            y="260"
        >O</text>

        <text
            class="foram-word word-2"
            x="470"
            y="330"
        >Overthinker</text>

    </g>


    <!-- R -->

    <g
        class="panel-group"
        onclick="openLetter('R')"
    >

        <polygon
            class="foram-panel"
            points="650,70 900,70 850,430 590,430"
        />

        <path
            d="M 650 70 L 900 70 L 850 430 L 590 430"
            fill="none"
            stroke="#050505"
            stroke-width="3"
        />

        <text
            class="foram-letter letter-3"
            x="720"
            y="260"
        >R</text>

        <text
            class="foram-word word-3"
            x="720"
            y="330"
        >Reckless</text>

    </g>


    <!-- A -->

    <g
        class="panel-group"
        onclick="openLetter('A')"
    >

        <polygon
            class="foram-panel"
            points="900,70 1180,70 1130,430 850,430"
        />

        <path
            d="M 900 70 L 1180 70 L 1130 430 L 850 430"
            fill="none"
            stroke="#050505"
            stroke-width="3"
        />

        <text
            class="foram-letter letter-4"
            x="1015"
            y="260"
        >A</text>

        <text
            class="foram-word word-4"
            x="1015"
            y="330"
        >Attitude</text>

    </g>


    <!-- M -->

    <g
        class="panel-group"
        onclick="openLetter('M')"
    >

        <polygon
            class="foram-panel"
            points="1180,70 1470,70 1400,430 1130,430"
        />

        <path
            d="M 1180 70 L 1470 70 L 1400 430 L 1130 430"
            fill="none"
            stroke="#050505"
            stroke-width="3"
        />

        <text
            class="foram-letter letter-5"
            x="1290"
            y="260"
        >M</text>

        <text
            class="foram-word word-5"
            x="1290"
            y="330"
        >Menace</text>

    </g>

</svg>

</section>


<!-- =========================================
     INDIVIDUAL LETTER SCREEN
========================================= -->

<section
    class="letter-screen"
    id="letterScreen"
>

    <div class="letter-screen-content">

        <div
            class="letter-screen-letter"
            id="letterScreenLetter"
        >
            F
        </div>

        <div
            class="letter-screen-word"
            id="letterScreenWord"
        >
            Funny
        </div>

        <div class="letter-screen-roast">

            <p id="roastText">
                Thinks she's hilarious.
                Unfortunately, she's right.
            </p>

        </div>

        <button
            class="next-letter-button"
            id="nextLetterButton"
            onclick="nextLetter()"
        >
            Next: O
        </button>

    </div>

</section>


<script>

/* =========================================
   ENVELOPE
========================================= */

function openEnvelope() {

    const wrapper =
        document.getElementById("envelopeWrapper");

    wrapper.classList.add("open");

}


/* =========================================
   SHOW FORAM
========================================= */

function showForam(event) {

    event.stopPropagation();

    const stage =
        document.querySelector(".stage");

    const foramScreen =
        document.getElementById("foramScreen");

    stage.style.transition =
        "opacity 0.7s ease";

    stage.style.opacity = "0";

    setTimeout(() => {

        stage.style.display = "none";

        foramScreen.classList.add("visible");

    }, 700);

}


/* =========================================
   FORAM DATA
========================================= */

const letterData = {

    F: {

        word: "Funny",

        roast:
            "Thinks she's hilarious. Unfortunately, she's right.",

        next:
            "Next: O"

    },

    O: {

        word: "Overthinker",

        roast:
            "Can find seventeen possible meanings in a two-word message.",

        next:
            "Next: R"

    },

    R: {

        word: "Reckless",

        roast:
            "Common sense is merely a suggestion.",

        next:
            "Next: A"

    },

    A: {

        word: "Attitude",

        roast:
            "Comes free with every opinion. No returns accepted.",

        next:
            "Next: M"

    },

    M: {

        word: "Menace",

        roast:
            "Looks harmless. That is the first mistake.",

        next:
            "Finish"

    }

};


let currentLetter = null;


/* =========================================
   OPEN INDIVIDUAL LETTER
========================================= */

function openLetter(letter) {

    currentLetter = letter;

    const screen =
        document.getElementById("letterScreen");

    const letterElement =
        document.getElementById("letterScreenLetter");

    const wordElement =
        document.getElementById("letterScreenWord");

    const roastElement =
        document.getElementById("roastText");

    const button =
        document.getElementById("nextLetterButton");

    const data =
        letterData[letter];

    if (!data) return;

    letterElement.textContent =
        letter;

    wordElement.textContent =
        data.word;

    roastElement.textContent =
        data.roast;

    button.textContent =
        data.next;

    screen.classList.add("visible");

}


/* =========================================
   NEXT LETTER
========================================= */

function nextLetter() {

    const order =
        ["F", "O", "R", "A", "M"];

    const currentIndex =
        order.indexOf(currentLetter);

    if (currentIndex === -1) {
        return;
    }

    if (
        currentIndex ===
        order.length - 1
    ) {

        // M is finished.
        // We can add the final reveal here later.

        return;

    }

    const next =
        order[currentIndex + 1];

    openLetter(next);

}

</script>

</body>
</html>
